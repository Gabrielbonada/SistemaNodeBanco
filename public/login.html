<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almeria NeoBank — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c900: #080810;
  --c800: #0f0f1a;
  --c700: #161622;
  --c600: #1e1e2e;
  --c500: #2a2a40;
  --c400: #3d3d58;
  --c300: #7070a0;
  --c200: #a0a0c0;
  --c100: #e8e8f5;
  --verde: #00f5a8;
  --verde-dim: rgba(0,245,168,0.12);
  --lilas: #8b5cf6;
  --lilas-dim: rgba(139,92,246,0.15);
  --rosa: #f472b6;
  --rosa-dim: rgba(244,114,182,0.12);
  --ambar: #fbbf24;
  --azul: #60a5fa;
  --tp: #eeeef8;
  --ts: #7070a0;
  --tt: #3d3d58;
  --borda: rgba(255,255,255,0.06);
  --borda-hover: rgba(255,255,255,0.12);
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-full: 999px;
}

html, body {
  height: 100%;
  font-family: var(--font-body);
  background: var(--c900);
  color: var(--tp);
  overflow-x: hidden;
}

/* ── FUNDO COM GLOW ── */
.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.bg-glow::before {
  content: '';
  position: absolute;
  top: -200px;
  left: -200px;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(139,92,246,0.14) 0%, transparent 70%);
  border-radius: 50%;
}

.bg-glow::after {
  content: '';
  position: absolute;
  bottom: -180px;
  right: -100px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(0,245,168,0.09) 0%, transparent 70%);
  border-radius: 50%;
}

.bg-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* ── LAYOUT ── */
.pagina {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 480px 1fr;
  grid-template-rows: 72px 1fr;
  grid-template-areas:
    "cabecalho cabecalho cabecalho"
    ". formulario .";
}

/* ── CABEÇALHO ── */
.cabecalho {
  grid-area: cabecalho;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  border-bottom: 1px solid var(--borda);
  background: rgba(15,15,26,0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 34px;
  height: 34px;
  border-radius: var(--r-md);
  background: linear-gradient(135deg, var(--lilas), var(--verde));
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-icon svg { width: 18px; height: 18px; }

.logo-texto strong {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  display: block;
  line-height: 1.1;
}

.logo-texto small {
  font-size: 10px;
  color: var(--ts);
  letter-spacing: 0.05em;
}

.cabecalho-links {
  display: flex;
  align-items: center;
  gap: 24px;
}

.cabecalho-links a {
  font-size: 13px;
  color: var(--ts);
  text-decoration: none;
  transition: color 0.2s;
}

.cabecalho-links a:hover { color: var(--tp); }

.btn-criar {
  background: var(--lilas-dim);
  border: 1px solid rgba(139,92,246,0.3);
  color: #c4b5fd;
  border-radius: var(--r-full);
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
  text-decoration: none;
}

.btn-criar:hover {
  background: var(--lilas);
  color: white;
  border-color: var(--lilas);
}

/* ── FORMULÁRIO ── */
.formulario-wrap {
  grid-area: formulario;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 48px 0;
}

.form-card {
  background: var(--c800);
  border: 1px solid var(--borda);
  border-radius: 24px;
  padding: 40px;
  position: relative;
  overflow: hidden;
}

.form-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--lilas), var(--verde));
  border-radius: 24px 24px 0 0;
}

.form-header {
  margin-bottom: 32px;
  text-align: center;
}

.form-header h1 {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 800;
  color: var(--tp);
  margin-bottom: 6px;
}

.form-header p {
  font-size: 14px;
  color: var(--ts);
}

/* ── ACESSO RÁPIDO ── */
.acesso-rapido {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
}

.btn-social {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--c700);
  border: 1px solid var(--borda);
  border-radius: var(--r-md);
  padding: 11px;
  font-size: 13px;
  font-weight: 500;
  color: var(--tp);
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
}

.btn-social:hover {
  background: var(--c600);
  border-color: var(--borda-hover);
}

.btn-social svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ── DIVISOR ── */
.divisor {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.divisor::before,
.divisor::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--borda);
}

.divisor span {
  font-size: 12px;
  color: var(--tt);
  white-space: nowrap;
}

/* ── CAMPOS ── */
.campos {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 24px;
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.campo label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ts);
}

.campo-input {
  position: relative;
}

.campo-input svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--tt);
  pointer-events: none;
  transition: color 0.2s;
}

.campo-input input {
  width: 100%;
  background: var(--c700);
  border: 1px solid var(--borda);
  border-radius: var(--r-md);
  padding: 12px 14px 12px 42px;
  font-size: 14px;
  color: var(--tp);
  outline: none;
  transition: all 0.2s;
  font-family: var(--font-body);
}

.campo-input input:focus {
  border-color: var(--lilas);
  background: var(--c600);
}

.campo-input input:focus + svg,
.campo-input input:focus ~ svg {
  color: var(--lilas);
}

.campo-input.com-icone-dir input {
  padding-right: 42px;
}

.campo-input .icon-dir {
  left: auto;
  right: 14px;
  cursor: pointer;
  pointer-events: all;
}

.campo-input input::placeholder { color: var(--tt); }

.campo-rodape {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.campo-rodape label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--ts);
  cursor: pointer;
}

.campo-rodape input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--lilas);
}

.campo-rodape a {
  font-size: 13px;
  color: #c4b5fd;
  text-decoration: none;
  transition: color 0.2s;
}

.campo-rodape a:hover { color: var(--lilas); }

/* ── BOTÃO PRINCIPAL ── */
.btn-entrar {
  width: 100%;
  background: linear-gradient(135deg, var(--lilas), #a855f7);
  color: white;
  border: none;
  border-radius: var(--r-md);
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  font-family: var(--font-display);
  letter-spacing: 0.02em;
  position: relative;
  overflow: hidden;
}

.btn-entrar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background 0.2s;
}

.btn-entrar:hover::after { background: rgba(255,255,255,0.08); }
.btn-entrar:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(139,92,246,0.35); }
.btn-entrar:active { transform: scale(0.99); }

/* ── LOADER DENTRO DO BOTÃO ── */
.btn-entrar.carregando {
  pointer-events: none;
  opacity: 0.85;
}

.btn-entrar.carregando .texto-btn { display: none; }
.btn-entrar .spinner { display: none; }
.btn-entrar.carregando .spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── RODAPÉ FORM ── */
.form-rodape {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--ts);
}

.form-rodape a {
  color: #c4b5fd;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}

.form-rodape a:hover { color: var(--lilas); }

/* ── BADGE SEGURANÇA ── */
.badge-seguranca {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 20px;
  font-size: 11px;
  color: var(--tt);
}

.badge-seguranca svg { width: 12px; height: 12px; color: var(--verde); }

/* ── ALERTA ERRO ── */
.alerta {
  display: none;
  align-items: center;
  gap: 10px;
  background: var(--rosa-dim);
  border: 1px solid rgba(244,114,182,0.2);
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--rosa);
  animation: fadeIn 0.3s ease;
}

.alerta.visivel { display: flex; }
.alerta svg { width: 15px; height: 15px; flex-shrink: 0; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

/* ── ANIMAÇÕES ENTRADA ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-up {
  animation: fadeUp 0.5s ease both;
}

.fade-up-1 { animation-delay: 0.1s; }
.fade-up-2 { animation-delay: 0.18s; }
.fade-up-3 { animation-delay: 0.26s; }

/* ── RESPONSIVO ── */
@media (max-width: 600px) {
  .pagina {
    grid-template-columns: 1fr;
    grid-template-areas:
      "cabecalho"
      "formulario";
  }

  .formulario-wrap {
    padding: 24px 16px;
  }

  .cabecalho {
    padding: 0 20px;
  }

  .cabecalho-links { display: none; }

  .acesso-rapido { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div class="pagina">

  <header class="cabecalho">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-texto">
        <strong>Almeria</strong>
        <small>NeoBank</small>
      </div>
    </div>

    <div class="cabecalho-links">
      <a href="#">Sobre nós</a>
      <a href="#">Planos</a>
      <a href="#">Suporte</a>
      <a href="cadastro.html" class="btn-criar">Criar conta</a>
    </div>
  </header>

  <div class="formulario-wrap">
    <div class="form-card fade-up fade-up-1">
      <div class="form-header">
        <h1>Bem-vindo de volta</h1>
        <p>Entre na sua conta Almeria NeoBank</p>
      </div>

      <div class="acesso-rapido fade-up fade-up-2">
        <button class="btn-social">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="btn-social">
          <svg viewBox="0 0 24 24" fill="var(--tp)" width="20" height="20">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/>
          </svg>
          TikTok
        </button>
      </div>

      <div class="divisor fade-up fade-up-2">
        <span>ou entre com e-mail</span>
      </div>

      <div id="alerta-erro" class="alerta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="alerta-texto">Credenciais inválidas. Tente novamente.</span>
      </div>

      <form class="campos fade-up fade-up-3" id="form-login" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <div class="campo-input">
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="campo-input com-icone-dir">
            <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <svg class="icon-dir" id="toggle-senha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="toggleSenha()">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <div class="campo-rodape">
          <label>
            <input type="checkbox" id="lembrar"> Lembrar de mim
          </label>
          <a href="#">Esqueci a senha</a>
        </div>
      </form>

      <button class="btn-entrar fade-up fade-up-3" id="btn-login" onclick="fazerLogin()">
        <span class="texto-btn">Entrar na conta</span>
        <span class="spinner"></span>
      </button>

      <div class="badge-seguranca fade-up fade-up-3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Conexão protegida por criptografia TLS 256-bit
      </div>

      <p class="form-rodape fade-up fade-up-3">
        Não tem uma conta? <a href="#">Abra a sua gratuitamente</a>
      </p>
    </div>
  </div>

</div>

<script src="../js/conexao_front_login.js"></script>

<script>
function toggleSenha() {
  const input = document.getElementById('senha');
  const icon = document.getElementById('toggle-senha');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function mostrarErro(msg) {
  const alerta = document.getElementById('alerta-erro');
  document.getElementById('alerta-texto').textContent = msg;
  alerta.classList.add('visivel');
  setTimeout(() => alerta.classList.remove('visivel'), 4000);
}

function fazerLogin() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btn-login');

  if (!email) { mostrarErro('Informe seu e-mail.'); return; }
  if (!senha) { mostrarErro('Informe sua senha.'); return; }

  btn.classList.add('carregando');

  // Simulação de requisição
  setTimeout(() => {
    btn.classList.remove('carregando');
    // Credenciais de demo — em produção, substituir pela chamada real
    if (email === 'demo@almeria.com' && senha === '123456') {
      window.location.href = "/index.html";
    } else {
      mostrarErro('E-mail ou senha incorretos. Tente: demo@almeria.com / 123456');
    }
  }, 1600);
}

// Enter para submeter
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin();
});
</script>

</body>
</html>
